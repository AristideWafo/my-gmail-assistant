[project]
name = "my-gmail-assistant"
version = "0.12.0"
description = "Modular AI email triage assistant (FastAPI + LangGraph)"
readme = "README.md"
requires-python = ">=3.11"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "prod"
build_command = ""
commit_message = "chore(release): {version} [skip ci]"
tag_format = "v{version}"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.branches.main]
match = "prod"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src", "main"]

[tool.coverage.report]
# A floor, not a target: raise it when coverage rises, never lower it to make a change pass.
fail_under = 97
show_missing = true
skip_covered = true
