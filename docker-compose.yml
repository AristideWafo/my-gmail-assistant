services:
  assistant:
    build: .
    container_name: my-gmail-assistant
    env_file:
      - .env
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  prometheus:
    image: prom/prometheus:latest
    container_name: gmail-assistant-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: gmail-assistant-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
