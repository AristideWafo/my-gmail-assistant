# Ports are published on BIND_ADDRESS, 127.0.0.1 by default: /metrics and Prometheus have no
# authentication. Reach them through an SSH tunnel, or set BIND_ADDRESS=0.0.0.0 in .env only
# behind a firewall and with GRAFANA_ADMIN_PASSWORD set.
services:
  assistant:
    # The image the release workflow publishes. Pin VERSION in .env: it is also how you roll back.
    image: ghcr.io/aristidewafo/my-gmail-assistant:${VERSION:-latest}
    container_name: my-gmail-assistant
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_PATH=/data/assistant.db
      - BACKUP_DIR=/backups
    volumes:
      - assistant-data:/data
      - assistant-backups:/backups
      # Optional rules file: set TRIAGE_RULES_PATH=/config/triage_rules.toml in .env
      - ./config:/config:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: gmail-assistant-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9090:9090"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  grafana:
    image: grafana/grafana:13.2.3
    container_name: gmail-assistant-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

volumes:
  assistant-data:
  assistant-backups:
  prometheus-data:
  grafana-data:
