name: CI

on:
  pull_request:
  push:
    branches: [prod]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # The coverage floor is fail_under in pyproject.toml.
      - name: Test
        run: pytest -v --cov

      - name: Build image (sanity check only)
        run: docker build -t my-gmail-assistant:ci .
