# Scenarios for `python -m src.evaluation agent`.
# Every mail here is invented: no real mail may be added to this file.
#   prompt           what the user writes to the bot
#   must_call        tools the run has to use
#   must_not_call    tools it must not use
#   answer_contains  text the answer has to hold (case ignored), all of them
#   answer_excludes  text the answer must not hold
# A scenario passes when the run ends on an answer and all of these hold.
# Dates are written for a run on Friday 2026-10-09.

[[scenario]]
name = "find_amount_in_a_mail"
prompt = "Combien demande le plombier pour le devis de la salle de bain ?"
must_call = ["search_mail"]
answer_contains = ["2 480"]

[[scenario.mail]]
id = "m1"
sender = "contact@plomberie-martin.fr"
subject = "Devis salle de bain"
body = "Bonjour, suite à ma visite, le devis pour la rénovation de la salle de bain s'élève à 2 480 euros TTC, valable 30 jours. Cordialement, P. Martin"
date = "2026-10-06"

[[scenario.mail]]
id = "m2"
sender = "newsletter@bricomag.fr"
subject = "Nos idées salle de bain"
body = "Découvrez nos 10 idées pour refaire votre salle de bain à partir de 990 euros."
date = "2026-10-07"

[[scenario]]
name = "nothing_found_is_said"
prompt = "Est-ce que la mairie m'a répondu pour le passeport ?"
must_call = ["search_mail"]
answer_excludes = ["rendez-vous confirmé", "votre passeport est prêt"]

[[scenario.mail]]
